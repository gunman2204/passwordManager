services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-passvault}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./PassVault-backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./PassVault-backend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - DB_USER=${DB_USER:-postgres}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-passvault}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey}
      - PORT=${PORT:-5000}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./PassVault
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:${PORT:-5000}/api
    depends_on:
      - backend

volumes:
  pgdata:
